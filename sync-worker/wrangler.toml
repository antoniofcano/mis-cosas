# patron-sync: sincronización del progreso de la app Patrón (ver nautica/docs/SYNC.md, «Despliegue»).
# Los secretos PEPPER y VAPID_PRIVATE NO van aquí: se ponen con `wrangler secret put …` (y, en local, con
# `--var NOMBRE:…` o un .dev.vars que nunca se sube a git).
name = "patron-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "patron-sync"
database_id = "4dc24eaf-443f-4e30-9061-d2a02abae437"
migrations_dir = "migrations"

# Recordatorio diario (nautica/docs/AVISOS.md): una sola tarea, una vez por hora, en punto. Sin suscripciones en la
# franja que toca, hace una consulta y se acaba.
[triggers]
crons = ["0 * * * *"]

# PUSH_ACTIVO: interruptor de emergencia de los avisos ("0" = no se envía nada y no se admiten altas).
# VAPID_PUBLIC: la clave pública VAPID (la misma que VAPID_PUBLICA en nautica/src/store/sync/config.js); la privada
# NO va aquí: `npm run vapid` la imprime y se guarda con `wrangler secret put VAPID_PRIVATE`. Vacía = avisos sin
# configurar (el servidor rechaza las altas y el cron no hace nada).
[vars]
PUSH_ACTIVO = "1"
VAPID_PUBLIC = "BAMs5eI8XeVF_3Neo_sLvwsiuGdk8zw9eF1PpHqm-TrSXlFPAxhqYEUXsNNsXzAjJxaggQS6M-GghBFMBWCxVIM"

# Registros de Cloudflare apagados: la cabecera Authorization lleva el código del alumno y no debe acabar en ningún
# registro. Para depurar un rato, `npx wrangler tail` (y no dejar registros permanentes con cabeceras).
[observability]
enabled = false
